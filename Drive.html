<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Application</title>
    <link rel="stylesheet" href="./assests/css/driveStyle.css">
</head>
<body>
    <a href="./index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
    <div class="form-container">
        <div class="form-header">
            <h2>Driver Registration</h2>
            <p>Join us and start working now</p>
        </div>

        <form action="#" method="POST" enctype="multipart/form-data">
            
            <h3 class="section-title">Personal Information</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" placeholder="Mobile Number" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="example@mail.com">
                </div>
                <div class="form-group">
                    <label>National ID</label>
                    <input type="number" placeholder="14-digit number" required>
                </div>
            </div>

            <h3 class="section-title">Vehicle & License Details</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Car Model & Year</label>
                    <input type="text" placeholder="Toyota & 2022" required>
                </div>
                <div class="form-group">
                    <label>Plate Number</label>
                    <input type="text" placeholder=".......">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>License Number</label>
                    <input type="number" placeholder="Driver License No.">
                </div>
                <div class="form-group">
                    <label>Expiration Date</label>
                    <input type="date" required>
                </div>
            </div>

            <div class="form-group">
                <label>License Type</label>
                <div class="radio-wrapper">
                    <label class="radio-item">
                        <input type="radio" name="licenseType" value="Professional" checked>
                        <span>Professional</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="licenseType" value="Private">
                        <span>Private</span>
                    </label>
                </div>
            </div>

            <h3 class="section-title">Required Documents</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Criminal Record </label>
                    <input type="file" accept="image/*,.pdf" class="file-input">
                </div>
                <div class="form-group">
                    <label>Driver License Photo</label>
                    <input type="file" accept="image/*" class="file-input">
                </div>
            </div>

            <button type="submit" class="submit-btn">Submit Application</button>
        </form>
    </div>

</body>
</html>
