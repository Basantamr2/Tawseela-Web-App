<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Ride - Tawseela</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assests/css/ride.css">
</head>
<body>

    <!-- Back to Home Button -->
    <a href="./index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>

    <section class="booking-page">
        <div class="container booking-container">
            <div class="booking-form-side">
                <h2>Book Your Ride</h2>
                <p>Enter your details to get a driver in minutes.</p>

                <form class="ride-form">
                    <div class="input-group">
                        <label><i class="fa-solid fa-location-dot"></i> Pickup Location</label>
                        <input type="text" placeholder="Enter pickup location" required>
                    </div>

                    <div class="input-group">
                        <label><i class="fa-solid fa-flag-checkered"></i> Destination</label>
                        <input type="text" placeholder="Where to?" required>
                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <label><i class="fa-solid fa-calendar-days"></i> Date</label>
                            <input type="date" required>
                        </div>
                        <div class="input-group">
                            <label><i class="fa-solid fa-clock"></i> Time</label>
                            <input type="time" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label><i class="fa-solid fa-car"></i> Select Service</label>
                        <select required>
                            <option value="" disabled selected>Choose a service...</option>
                            <option value="economy">Tawseela X (Economy)</option>
                            <option value="premium">Tawseela Comfort (Premium)</option>
                            <option value="van">Tawseela Van (Large Group)</option>
                        </select>
                    </div>

                    <a href="./payment.html" style="text-decoration: none; width: 100%;">
                        <button type="button" class="btn-confirm">Confirm Booking</button>
                    </a>
                </form>
            </div>

            <div class="booking-map-side">
                <div class="map-placeholder">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d55251.37709964741!2d31.2234448!3d30.0594885!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14583fa60b21beeb%3A0x79dfb296efaa4642!2sCairo%2C%20Cairo%20Governorate!5e0!3m2!1sen!2seg!4v1700000000000!5m2!1sen!2seg"
                        width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>

                    <div class="driver-status">
                        <i class="fa-solid fa-clock"></i>
                        <span>Drivers nearby: 5 mins away</span>
                    </div>
                </div>
            </div>

        </div>
    </section>
</body>

</html>
